<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="108" fill="none" stroke="#334155" stroke-width="4"/>
  
  <!-- Subtle grid dividers -->
  <line x1="64" y1="256" x2="448" y2="256" stroke="#334155" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  <line x1="256" y1="64" x2="256" y2="448" stroke="#334155" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Plus (+) in Q1 -->
  <rect x="96" y="136" width="96" height="16" rx="8" fill="#38bdf8"/>
  <rect x="136" y="96" width="16" height="96" rx="8" fill="#38bdf8"/>
  
  <!-- Minus (-) in Q2 -->
  <rect x="320" y="136" width="96" height="16" rx="8" fill="#34d399"/>
  
  <!-- Multiply (×) in Q3 -->
  <g transform="translate(144, 368) rotate(45)">
    <rect x="-48" y="-8" width="96" height="16" rx="8" fill="#fbbf24"/>
    <rect x="-8" y="-48" width="16" height="96" rx="8" fill="#fbbf24"/>
  </g>
  
  <!-- Divide (÷) in Q4 -->
  <rect x="320" y="360" width="96" height="16" rx="8" fill="#f472b6"/>
  <circle cx="368" cy="324" r="12" fill="#f472b6"/>
  <circle cx="368" cy="412" r="12" fill="#f472b6"/>
</svg>
