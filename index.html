    <script>
      (function () {
        try { if (localStorage.getItem('polytrack_notification_ads') === 'off') return; } catch (e) {}
        function esc(s) { return String(s || '').replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
        window.addEventListener('load', function () {
          fetch('/api/bidvertiser?max=3&q=games&ref=' + encodeURIComponent(location.href))
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (!d || !d.ads || !d.ads.length) return;
              var bar = document.createElement('div');
              bar.id = 'bv-xml-ads';
              bar.style.cssText = 'position:fixed;left:0;right:0;bottom:0;z-index:9999;display:flex;gap:8px;overflow-x:auto;padding:8px;background:rgba(15,15,20,.92);font:13px system-ui,sans-serif';

              }).join('') + '<button aria-label="Close ads" style="background:none;border:0;color:#fff;font-size:18px;cursor:pointer">&times;</button>';
              bar.querySelector('button').onclick = function () { bar.remove(); };
              document.body.appendChild(bar);
            })
            .catch(function () {});
        });
      })();

    <style>
      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        background-color: #09090b;
        color-scheme: dark;
        color: #fafafa;
        font-family: var(--app-font, 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif);
      }

      /* Solid 3D card styling matching the attached element code style.
         No transform or backface-visibility here on purpose: either one promotes every card to
         its own composited layer, so a catalog of hundreds of cards made desktop scrolling slow.
         The lift below is applied on hover only, where a single card is affected. */
      .game-card {
        background: #1d1d1d !important;
        border-radius: 20px !important;
        border: none !important;
        position: relative;
        isolation: isolate;
        contain: layout style;
        box-shadow:
          inset 0 0 0 1px rgba(44, 47, 54, 0.65),
          inset 0 0 50px 0 rgba(255, 255, 255, 0.02),
          0 10px 24px -6px rgba(0, 0, 0, 0.5),
          0 2px 6px rgba(0, 0, 0, 0.3) !important;
        transition: transform 220ms cubic-bezier(0.2, 0.8, 0.2, 1), box-shadow 220ms ease;
      }

      /* Mosaic cards sit in fixed-height grid cells, so cards left outside the viewport can skip
         layout and paint entirely while the catalog scrolls. */
      .game-card-mosaic {
        content-visibility: auto;
        contain-intrinsic-size: auto 216px;
      }

      /* The cover zoom is pointer-only (see the hover block below): on touch screens a tap left
         the card stuck in its hover state, so the cover stayed zoomed in after you moved on. */
      .game-card-cover,
      .game-card-cover-soft {
        transition: transform 500ms cubic-bezier(0.22, 1, 0.36, 1);
      }

      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      /* One focus treatment for the whole hub, so keyboard users can always see where they are.
         The stretched card link below replaces its own ring with a ring around the whole card. */
      :where(a, button, input, textarea, select, [role="switch"], [role="radio"]):not(.game-card-link):focus-visible {
        outline: 2px solid rgba(250, 250, 250, 0.92) !important;
        outline-offset: 2px !important;
      }

      /* The card title is the only link in a game card, and its pseudo-element covers the card:
         the whole card is one large hit target without nesting a link in a link. */
      .game-card-link::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 20px;
      }

      .game-card-link:focus-visible {
        outline: none !important;
      }

      .game-card:has(.game-card-link:focus-visible) {
        outline: 2px solid rgba(250, 250, 250, 0.92);
        outline-offset: 2px;
      }

      .game-card:has(.game-card-link:focus-visible) .game-card-link {
        color: #ffffff;
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      /* Interactive text and controls shouldn't wait 300ms for a double-tap on touch screens. */
      a, button, input, textarea, select, [role="switch"] {
        touch-action: manipulation;
      }

      body {
        -webkit-tap-highlight-color: rgba(255, 255, 255, 0.08);
      }

      @media (pointer: fine) {
        html {
          overscroll-behavior: none;
        }
      }

      @media (hover: hover) and (pointer: fine) {
      .game-card:hover {
        transform: perspective(1000px) translateY(-3px) translateZ(6px);
        box-shadow:
          inset 0 0 0 1px rgba(70, 75, 88, 0.8),
          inset 0 0 50px 0 rgba(255, 255, 255, 0.035),
          0 20px 36px -10px rgba(0, 0, 0, 0.7),
          0 6px 14px rgba(0, 0, 0, 0.4) !important;
      }

      .game-card:hover .game-card-cover,
      .game-card:focus-within .game-card-cover {
        transform: scale(1.1);
      }

      .game-card:hover .game-card-cover-soft,
      .game-card:focus-within .game-card-cover-soft {
        transform: scale(1.05);
        transition-duration: 300ms;
      }
      }

      /* Card chips sit on a semi-opaque black pill and are re-sampled on every scroll frame;
         dropping their backdrop blur keeps a screenful of cards cheap to scroll. */
      .game-card .backdrop-blur-sm,
      .game-card .backdrop-blur {
        -webkit-backdrop-filter: none !important;
        backdrop-filter: none !important;
      }

      .game-card:focus-within {
        outline: 1px solid rgba(228, 228, 231, 0.5);
        outline-offset: 2px;
      }

      /* Solid 3D container panels (catalog area, chat board, view counter) */
      .solid-3d-panel {
        background: #1d1d1d !important;
        border-radius: 20px !important;
        border: none !important;
        box-shadow:
          inset 0 0 0 1px rgba(44, 47, 54, 0.52),
          inset 0 0 50px 0 rgba(255, 255, 255, 0.02),
          0 14px 30px -8px rgba(0, 0, 0, 0.55),
          0 2px 8px rgba(0, 0, 0, 0.3) !important;
        position: relative;
        font-family: system-ui, -apple-system, sans-serif;
      }

      .solid-3d-chip {
        border-radius: 36px;
        background: rgba(255, 255, 255, 0.04);
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02), inset 0 1px 0 0 rgba(255, 255, 255, 0.04);
      }

      @keyframes settings-backdrop-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes settings-backdrop-out { from { opacity: 1; } to { opacity: 0; } }
      @keyframes settings-panel-in { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: none; } }
      @keyframes settings-panel-out { from { opacity: 1; transform: none; } to { opacity: 0; transform: translateY(12px) scale(0.97); } }
      .settings-backdrop-enter { animation: settings-backdrop-in 200ms ease-out both; }
      .settings-backdrop-exit { animation: settings-backdrop-out 180ms ease-in both; }
      .settings-panel-enter { animation: settings-panel-in 220ms cubic-bezier(0.22, 1, 0.36, 1) both; }
      .settings-panel-exit { animation: settings-panel-out 180ms ease-in both; }

      @media (prefers-reduced-motion: reduce) {
        .settings-backdrop-enter, .settings-backdrop-exit, .settings-panel-enter, .settings-panel-exit { animation: none; }
        .game-card { transition: none; }
        .game-card:hover { transform: none; }
        .game-card-cover, .game-card-cover-soft { transition: none; }
        .game-card:hover .game-card-cover, .game-card:hover .game-card-cover-soft { transform: none; }
        .animate-spin, .animate-pulse, .animate-bounce { animation: none; }
      }

      /* Touch devices: backdrop blur re-samples everything behind it on every scroll frame. */
      @media (pointer: coarse) {
        .backdrop-blur-sm, .backdrop-blur, .backdrop-blur-md, .backdrop-blur-lg, .backdrop-blur-xl, .backdrop-blur-2xl {
          -webkit-backdrop-filter: none !important;
          backdrop-filter: none !important;
        }
      }

      /* Keep the in-feed native ad compact. */
      .catalog-native-ad img { max-height: 72px !important; width: auto !important; object-fit: cover; }
      .catalog-native-ad iframe { max-height: 120px !important; }

      /* Clean subtle scrollbars */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: #27272a;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #3f3f46;
      }

      /* Message Scroller primitive styles */
      .cn-message-scroller {
        position: relative;
        display: flex;
        width: 100%;
        height: 100%;
        min-height: 0;
        flex-direction: column;
        overflow: hidden;
      }

      .cn-message-scroller-viewport {
        width: 100%;
        height: 100%;
        min-height: 0;
        min-width: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
      }

      .cn-message-scroller-content {
        display: flex;
        height: max-content;
        min-height: 100%;
        flex-direction: column;
      }

      .cn-message-scroller-item {
        min-width: 0;
        flex-shrink: 0;
      }

      .cn-message-scroller-button {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        transition: all 0.2s cubic-bezier(0.23, 1, 0.32, 1);
        z-index: 10;
      }

      .cn-message-scroller-button[data-active="false"] {
        pointer-events: none;
        opacity: 0;
        transform: translate(-50%, 8px) scale(0.95);
      }

      .cn-message-scroller-button[data-active="true"] {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }

      .cn-message-scroller-button[data-direction="end"] {
        bottom: 0.75rem;
      }
    </style>
</head>
