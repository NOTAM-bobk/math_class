<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Games</title>
    <meta name="description" content="An isolated experiment testing image-led game tiles.">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#09090b">
    <link rel="icon" href="https://www.google.com/favicon.ico" sizes="any">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/test/test.css">
</head>
<body>
    <header class="top">
        <label class="search" for="search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="6.4" fill="none" stroke="currentColor" stroke-width="1.9"/>
                <path d="M15.8 15.8 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
            </svg>
            <input id="search" type="search" placeholder="Search games" autocomplete="off" spellcheck="false" enterkeyhint="search" aria-label="Search games">
        </label>

        <button class="orb" id="random-btn" type="button" aria-label="Open a random game" title="Random game">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 7h3.6c1.2 0 2.3.6 3 1.5l5.4 7c.7.9 1.8 1.5 3 1.5H20M4 17h3.6c1.2 0 2.3-.6 3-1.5l5.4-7c.7-.9 1.8-1.5 3-1.5H20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M17.6 4.4 20 7l-2.4 2.6M17.6 14.4 20 17l-2.4 2.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>

        <div class="filter">
            <button class="orb" id="filter-toggle" type="button" aria-label="Filters" aria-haspopup="true" aria-expanded="false" aria-controls="filter-menu">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M4 7h9M17 7h3M4 12h4M12 12h8M4 17h10M18 17h2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <circle cx="15" cy="7" r="2.1" fill="none" stroke="currentColor" stroke-width="1.8"/>
                    <circle cx="10" cy="12" r="2.1" fill="none" stroke="currentColor" stroke-width="1.8"/>
                    <circle cx="16" cy="17" r="2.1" fill="none" stroke="currentColor" stroke-width="1.8"/>
                </svg>
                <span class="orb-dot" id="filter-dot" hidden></span>
            </button>
            <div class="filter-menu" id="filter-menu" role="menu" aria-label="Filters" hidden></div>
        </div>

        <button class="orb orb--end" id="settings-btn" type="button" aria-label="Settings" title="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M19.4 13a7.7 7.7 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.4h-4L10.6 6a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4L6.6 11a7.7 7.7 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                <circle cx="12" cy="12" r="2.7" fill="none" stroke="currentColor" stroke-width="1.5"/>
            </svg>
        </button>
    </header>

    <main class="wrap">
        <div class="intro">
            <p>
                <span class="count" id="count">Loading…</span> ·
                <span class="hint hint--hover">hover a tile for details</span>
                <span class="hint hint--touch">tap a tile for details</span>
            </p>
        </div>

        <section class="continue" id="continue" aria-label="Continue playing" hidden></section>

        <div class="grid" id="grid">
            <p class="grid-message">Loading covers…</p>
        </div>
    </main>

    <nav class="dock" aria-label="Primary">
        <button class="dock-btn is-active" id="dock-games" type="button" aria-current="page" aria-controls="grid">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3.5" y="3.5" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
                <rect x="13.5" y="3.5" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
                <rect x="3.5" y="13.5" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
                <rect x="13.5" y="13.5" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/>
            </svg>
            <span>Games</span>
        </button>
        <button class="dock-btn" id="dock-search" type="button" aria-controls="search" aria-label="Search games">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="11" cy="11" r="6.4" fill="none" stroke="currentColor" stroke-width="1.9"/>
                <path d="M15.8 15.8 20 20" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
            </svg>
            <span>Search</span>
        </button>
    </nav>

    <script type="module" src="/test/test.js"></script>
</body>
</html>
